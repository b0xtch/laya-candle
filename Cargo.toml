[package]
name = "laya-candle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust inference for Laya typed decision models using Candle"
license = "Apache-2.0 AND MIT"
readme = "README.md"
repository = "https://github.com/b0xtch/laya-candle"
keywords = ["inference", "candle", "laya", "machine-learning"]
categories = ["science", "command-line-utilities"]
include = ["/src/**", "/examples/**", "/tests/**", "!/tests/**/__pycache__/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/deny.toml", "/LICENSE", "/LICENSE-MIT", "/NOTICE"]

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-metal-kernels = { version = "0.11.0", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
clap = { version = "4", features = ["derive"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "laya-candle"
path = "src/main.rs"
